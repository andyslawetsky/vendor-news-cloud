name: Collect vendor browser news
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect-news.cjs
      - package.json
      - .github/workflows/collect.yml
permissions:
  contents: write
concurrency:
  group: vendor-browser-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum node collect-news.cjs
      - name: Publish successful collection
        run: |
          git config user.name "Vendor News Collector"
          git config user.email "vendor-news-collector@users.noreply.github.com"
          git add browser-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public vendor news"
            git push
          fi
